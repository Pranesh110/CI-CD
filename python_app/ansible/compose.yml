
services:

  db:
    
    image: praneshdoc07/helpdesk-db:16
    container_name: helpdesk-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-init:
   
    image: praneshdoc07/helpdesk-web:v1.0
    container_name: helpdesk-init
    restart: "no"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    command: ["python", "db_init.py"]

  web:
    image: praneshdoc07/helpdesk-web:v1.0
    container_name: helpdesk-web
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      web-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
