
services:
  nginx:
    image: praneshdoc07/nginx_student_reg:${WEB_VERSION}
    container_name: student_nginx_python
    ports:
      - "80:80"
    depends_on:
      python:
        condition: service_started
    networks:
      front-network:
        ipv4_address: 172.20.0.8
    restart: unless-stopped

  python:
    image: praneshdoc07/py_student_reg:${WEB_VERSION}
    container_name: student_python_python
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      front-network:
        ipv4_address: 172.20.0.9
      backend-network:
        ipv4_address: 172.21.0.9
    restart: unless-stopped

  db:
    image: praneshdoc07/mariadb_student_reg:16
    container_name: student_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - student_portal_python_dbvol:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      backend-network:
        ipv4_address: 172.21.0.10
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  front-network:
    name: student_portal_front-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

  backend-network:
    name: student_portal_backend-network
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

volumes:
  student_portal_python_dbvol:
    name: student_portal_python_dbvol
